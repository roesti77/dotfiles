name: sway-ci

on:
  pull_request:
    paths: ['sway/**', '.github/workflows/sway-ci.yml']
  push:
    branches: [main]
    paths: ['sway/**', '.github/workflows/sway-ci.yml']

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No duplicate key bindings
        # sway --validate does not reject these, and a duplicate breaks the config
        # on load — which is how `$mod+p` reached main bound to two commands.
        # Strips flags (--locked, --no-repeat) so the key combination is compared,
        # not the flag. Mode-local bindings are indented and belong to their own
        # namespace, so only column-0 bindsym lines are considered.
        run: |
          dupes=$(grep '^bindsym ' sway/.config/sway/config \
                  | sed 's/^bindsym //' \
                  | sed -E 's/^(--[a-z-]+ )+//' \
                  | awk '{print $1}' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            printf '::error::key bound more than once: %s\n' $dupes
            exit 1
          fi

      - name: Shell scripts parse under dash
        # the scripts run with /bin/sh, which is dash on debian — not bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dash
          fail=0
          for f in sway/.config/sway/scripts/*; do
            [ -x "$f" ] || continue
            dash -n "$f" || { echo "::error file=$f::syntax error under dash"; fail=1; }
          done
          exit $fail

      - name: sway --validate
        run: |
          sudo apt-get install -y -qq sway
          # the config references ~/.config/sway/scripts and ~/.config/kanshi
          mkdir -p "$HOME/.config"
          cp -r sway/.config/sway "$HOME/.config/sway"
          sway --validate -c "$HOME/.config/sway/config"
