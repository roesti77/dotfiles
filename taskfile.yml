version: '3'

tasks:
  setup:
    desc: stow the shared config (run this on macOS and linux alike)
    cmds:
      - stow zsh
      - stow p10k
      - stow tig
      - stow nvim
      - stow zellij
      - stow devbox
      - stow lazygit
      - stow ghostty
      - stow claude
      - stow cursor

  setup-linux:
    desc: install and stow the linux-only config (sway session, superfile)
    cmds:
      - stow sway
      # Must exist as a real directory first. superfile ships one file here, so
      # stow would otherwise fold the package and make ~/.config/superfile a
      # symlink into this repo -- superfile then writes its own config.toml and
      # theme/ into the checkout. Same trap the nvim package already sits in, and
      # the one cursor/README.md warns about for ~/.cursor.
      - mkdir -p ~/.config/superfile
      - stow superfile
      - ./sway/.config/sway/scripts/bootstrap

  sway:deps:
    desc: install the apt packages the sway session needs
    preconditions:
      - sh: command -v apt-get >/dev/null
        msg: no apt here — this task is for debian-based systems
    cmds:
      - ./sway/.config/sway/scripts/bootstrap --deps

  check:
    desc: validate claude + cursor config (JSON + shell syntax)
    cmds:
      - jq -e . claude/.claude/settings.seed.json >/dev/null
      - for f in cursor/.cursor/*.json; do jq -e . "$f" >/dev/null; done
      - for f in claude/.claude/hooks/*.sh claude/.claude/statusline-command.sh zsh/bin/*; do if [ -f "$f" ]; then bash -n "$f"; fi; done
      - if command -v shellcheck >/dev/null; then for f in claude/.claude/hooks/*.sh claude/.claude/statusline-command.sh zsh/bin/*; do if [ -f "$f" ]; then shellcheck "$f"; fi; done; fi

  clone-plugins:
    desc: fetch the oh-my-zsh plugins that are not vendored
    vars:
      ZSH_CUSTOM:
        sh: echo "$HOME/.config/ohmyzsh/custom"
    cmds:
      - mkdir -p {{.ZSH_CUSTOM}}/plugins
      - if [ ! -d "{{.ZSH_CUSTOM}}/plugins/copyzshell" ]; then git clone git@github.com:rutchkiwi/copyzshell.git {{.ZSH_CUSTOM}}/plugins/copyzshell; fi
      - if [ ! -d "{{.ZSH_CUSTOM}}/plugins/zsh-peco-history" ]; then git clone git@github.com:jimeh/zsh-peco-history.git {{.ZSH_CUSTOM}}/plugins/zsh-peco-history; fi
      - if [ ! -d "{{.ZSH_CUSTOM}}/plugins/kubetail" ]; then git clone git@github.com:johanhaleby/kubetail.git {{.ZSH_CUSTOM}}/plugins/kubetail; fi

